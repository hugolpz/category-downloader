name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22] # the app needs Node >= 20 (see package.json "engines")

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting (Prettier)
        run: npx prettier --check "src/**/*.{js,vue}" "tests/**/*.js" "server/*.mjs" "*.js"

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      # Starts the real server with dummy settings and checks that it serves the built app and the
      # public login config (and never the secret). No Wikimedia account or network needed.
      - name: Server smoke test
        env:
          OAUTH_CLIENT_ID: ci-client-id
          OAUTH_CLIENT_SECRET: ci-client-secret
          OAUTH_REDIRECT_URI: http://localhost:8787/oauth/wikimedia/success
          PORT: 8787
        run: |
          node server/index.mjs &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8787/auth/config >/dev/null 2>&1 && break
            sleep 0.5
          done
          config="$(curl -fsS http://localhost:8787/auth/config)"
          page="$(curl -fsS http://localhost:8787/)"
          echo "$config"
          # here-strings, not pipes: with `pipefail`, `grep -q` closing a pipe early can fail a good run
          grep -q '"clientId":"ci-client-id"' <<<"$config"
          if grep -q 'ci-client-secret' <<<"$config"; then echo "secret leaked in /auth/config"; exit 1; fi
          grep -q '<div id="app">' <<<"$page"

  # Continuous deployment: only after every check above passed, only for pushes to main.
  # No SSH key or Toolforge password is involved: the job uploads the built app to the running
  # service, signed with a shared secret (HMAC). See DEPLOY.md, "Automatic deploy from GitHub".
  deploy:
    name: Deploy to Toolforge
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hugolpz/commons-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # holds DEPLOY_SECRET and DEPLOY_URL; add required reviewers here if you want a manual gate
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never interrupt a deploy half way
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package the release
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          tar -czf release.tgz dist server
          ls -l release.tgz

      - name: Upload to Toolforge
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }} # https://commons-flow.toolforge.org
        run: |
          set -euo pipefail
          ts="$(( $(date +%s) * 1000 ))"
          # HMAC-SHA256 over "<timestamp>." followed by the file bytes; the server recomputes and compares.
          sig="$({ printf '%s.' "$ts"; cat release.tgz; } | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -r | cut -d' ' -f1)"
          curl -fsS --max-time 120 -X POST "$DEPLOY_URL/deploy" \
            -H "X-Deploy-Timestamp: $ts" \
            -H "X-Deploy-Signature: sha256=$sig" \
            -H "Content-Type: application/gzip" \
            --data-binary @release.tgz

      # The server restarts itself after installing; wait until it reports this exact commit.
      - name: Wait for the new version
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in $(seq 1 36); do
            version="$(curl -fsS --max-time 10 "$DEPLOY_URL/version" 2>/dev/null || true)"
            if grep -qF "$GITHUB_SHA" <<<"$version"; then echo "Live: $version"; exit 0; fi
            echo "Waiting for $GITHUB_SHA (got: ${version:-no answer})"
            sleep 5
          done
          echo "The new version did not come up within 3 minutes" >&2
          exit 1
